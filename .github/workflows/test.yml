name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check browser entry syntax
        run: node --input-type=module --check < docs/app.js
      - name: Run tests
        run: node --test tests/*.test.mjs
